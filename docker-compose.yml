services:
  vault:
    image: hashicorp/vault:1.17
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_API_ADDR: "http://127.0.0.1:8200"
    volumes:
      - vault_data:/vault/data
      - ./config/vault/vault.hcl:/vault/config/vault.hcl:ro
    command: sh -c "chown -R vault:vault /vault/data && su-exec vault vault server -config=/vault/config/vault.hcl"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "vault status -address=http://127.0.0.1:8200 -format=json 2>/dev/null | grep -q '\"sealed\".*false' || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "127.0.0.1:8200:8200"
    restart: unless-stopped

  vault-unseal:
    image: hashicorp/vault:1.17
    depends_on:
      vault:
        condition: service_started
    volumes:
      - ./config/vault/init.json:/vault/keys/init.json:ro
    environment:
      VAULT_ADDR: "http://vault:8200"
    entrypoint:
      - sh
      - -c
      - |
        echo "[auto-unseal] Waiting for Vault to be reachable..."
        sleep 2
        attempts=0
        while true; do
          vault status >/dev/null 2>&1
          rc=$$?
          if [ $$rc -eq 0 ] || [ $$rc -eq 2 ]; then break; fi
          attempts=$$((attempts + 1))
          if [ $$attempts -ge 30 ]; then
            echo "[auto-unseal] Vault not reachable after 30 attempts"
            exit 1
          fi
          sleep 2
        done
        echo "[auto-unseal] Vault is reachable"
        vault status >/dev/null 2>&1
        if [ $$? -eq 2 ]; then
          UNSEAL_KEY=$$(sed -n 's/.*"unseal_keys_b64":\["\([^"]*\)".*/\1/p' /vault/keys/init.json)
          if [ -z "$$UNSEAL_KEY" ]; then
            echo "[auto-unseal] ERROR: could not extract unseal key"
            exit 1
          fi
          echo "[auto-unseal] Unsealing..."
          vault operator unseal "$$UNSEAL_KEY"
          echo "[auto-unseal] ✓ Vault unsealed"
        else
          echo "[auto-unseal] Vault already unsealed"
        fi
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foundry
      POSTGRES_PASSWORD: foundry
      POSTGRES_DB: foundry
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundry"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  foundryd:
    build: .
    command: foundryd
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      DATABASE_URL: postgres://foundry:foundry@postgres:5432/foundry
      FOUNDRY_BIND_ADDR: 0.0.0.0:8081
      FOUNDRY_ENABLE_TUNNEL: "false"
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_BOOTSTRAP_TOKEN: ${VAULT_BOOTSTRAP_TOKEN}
      CF_TUNNEL_NAME: mini_server
      CF_TUNNEL_DOMAIN: foundry.l3s.me
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8081:8081"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN}"]
    network_mode: host
    restart: unless-stopped

  agent:
    build: .
    command: foundry-agent
    depends_on:
      foundryd:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "foundry-agent"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      FOUNDRY_SERVER_URL: http://foundryd:8081
      FOUNDRY_AGENT_ID: docker-agent
      FOUNDRY_WORKSPACE_DIR: /Users/lucas/workspace
      VAULT_ADDR: http://vault:8200
      VAULT_ROLE_ID: ${VAULT_ROLE_ID}
      VAULT_BOOTSTRAP_TOKEN: ${VAULT_BOOTSTRAP_TOKEN}
      FOUNDRY_SELF_REPO: Lucas-William-Bateson/foundry
      FOUNDRY_SELF_DEPLOY_SCRIPT: /app/scripts/deploy.sh
      GITHUB_APP_PRIVATE_KEY_PATH: /secrets/github-app.pem
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /Users/lucas/workspace:/Users/lucas/workspace
      - .:/app
      - ${GITHUB_APP_PRIVATE_KEY_FILE:-/dev/null}:/secrets/github-app.pem:ro
    working_dir: /app
    restart: unless-stopped

volumes:
  postgres_data:
  vault_data:
