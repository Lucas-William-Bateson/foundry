# Minimal production config — Foundry runs natively via launchd (SQLite + age-encrypted secrets).
# Only cloudflared remains in Docker to expose the tunnel.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN}"]
    network_mode: host
    restart: unless-stopped
